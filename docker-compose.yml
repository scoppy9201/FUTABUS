# Monexa — development stack.
#
#   docker compose up --build
#
# The application source is bind-mounted so code changes are reflected live.
# MySQL and Redis run as containers; assets are built with the "vite" service
# or on the host (npm run dev). This does not affect your existing Laragon
# workflow — it is an alternative, self-contained environment.

services:
  app:
    build:
      context: .
      target: development
    image: monexa-app:dev
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-monexa}
      DB_USERNAME: ${DB_USERNAME:-monexa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      OPTIMIZE: "false"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - monexa

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - monexa

  # Queue worker (database/redis backed). Uses the same app image.
  queue:
    image: monexa-app:dev
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      OPTIMIZE: "false"
      WAIT_FOR_DB: "true"
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    depends_on:
      - app
    networks:
      - monexa

  # Vite dev server for hot asset building (optional).
  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - monexa

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-monexa}
      MYSQL_USER: ${DB_USERNAME:-monexa}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monexa

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-63790}:6379"
    volumes:
      - redis-data:/data
    networks:
      - monexa

volumes:
  mysql-data:
  redis-data:

networks:
  monexa:
    driver: bridge

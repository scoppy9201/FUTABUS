name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, pdo_mysql, zip, pcntl, redis
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (locked)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies (locked)
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # NOTE: the existing codebase predates Pint enforcement, so this is
      # reported but non-blocking for now. Remove `continue-on-error` once the
      # code style has been normalised (`vendor/bin/pint`) to make lint a gate.
      - name: Lint (Laravel Pint)
        continue-on-error: true
        run: vendor/bin/pint --test

      # Build assets BEFORE tests: feature tests hit routes that render Blade
      # views using @vite, which require public/build/manifest.json to exist.
      - name: Build front-end assets
        run: npm run build

      - name: Run tests (PHPUnit)
        run: php artisan test

  docker:
    name: Docker Image Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: monexa-app:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          build-args: |
            APP_IMAGE=monexa-app:ci
          tags: monexa-nginx:ci
          load: true

      - name: Smoke test — image boots
        run: |
          set -euo pipefail
          docker run -d --name monexa_smoke \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=production \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/db.sqlite \
            -e WAIT_FOR_DB=false \
            -e CACHE_STORE=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            monexa-app:ci
          echo "Waiting for the php-fpm healthcheck to report healthy..."
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' monexa_smoke || echo "starting")
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && break
            [ "$i" -eq 20 ] && { docker logs monexa_smoke; exit 1; }
            sleep 3
          done
          docker rm -f monexa_smoke

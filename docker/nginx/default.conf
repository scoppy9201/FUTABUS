server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Honour X-Forwarded-* from the upstream load balancer / TLS terminator.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Lightweight health endpoint served by the app (bootstrap/app.php health: /up).
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-lived caching for fingerprinted Vite build assets.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP requests are proxied to the php-fpm "app" service (service name, not localhost).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files and sensitive dotfiles.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

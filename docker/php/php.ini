; Monexa — production PHP settings.
; Keep uploads generous for spreadsheet imports/exports (maatwebsite/excel).

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 32M
post_max_size = 40M

expose_php = Off
date.timezone = UTC

; Errors go to the container log stream, never to the response body in prod.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Realpath cache improves autoload performance.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

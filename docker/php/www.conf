; Monexa — php-fpm pool overrides.
; The master process runs as root (to bind the socket) and workers drop to
; the unprivileged www-data user.

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic process management sized for a small/medium container.
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Expose the FPM status/ping endpoints for the container healthcheck.
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Send worker stdout/stderr to the container log stream.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

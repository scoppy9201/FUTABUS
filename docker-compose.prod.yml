# Monexa — production stack.
#
# Images are pre-built and pushed by CI; this file only runs them.
#   APP_IMAGE / NGINX_IMAGE are provided by deploy.sh (commit-SHA tagged).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Database and Redis are NOT published to the host/Internet — only nginx is.
# TLS is expected to be terminated by an external proxy (see docs/DEPLOYMENT.md).

x-app-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/owner/monexa-app:latest}
    restart: unless-stopped
    <<: *app-env
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    networks:
      - monexa

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/owner/monexa-nginx:latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Share uploaded files so nginx can serve /storage/* directly.
      - storage-data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - monexa

  queue:
    image: ${APP_IMAGE:-ghcr.io/owner/monexa-app:latest}
    restart: unless-stopped
    <<: *app-env
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3", "--max-time=3600"]
    stop_signal: SIGTERM
    stop_grace_period: 95s
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "php artisan queue:monitor default 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - monexa

  scheduler:
    image: ${APP_IMAGE:-ghcr.io/owner/monexa-app:latest}
    restart: unless-stopped
    <<: *app-env
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Overrides the image's php-fpm healthcheck: this role has no FPM socket,
    # so we verify the scheduler process is alive instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - monexa

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    networks:
      - monexa

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - monexa

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  storage-data:
    driver: local

networks:
  monexa:
    driver: bridge
